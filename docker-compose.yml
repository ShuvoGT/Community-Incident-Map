# Local development infrastructure for the Dhaka Community Incident Map.
# Production uses managed equivalents; this is for local dev only.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: incidents-db
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidents
    ports:
      # Host 55432 -> container 5432 to avoid clashing with a local Postgres.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: incidents-redis
    ports:
      # Host 6380 -> container 6379 to avoid clashing with a local Redis.
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # S3-compatible private object storage for evidence (never public).
  # adobe/s3mock is used for local dev because the minio/minio image is not
  # pullable in this environment; any S3-compatible store works in production.
  # It pre-creates the evidence bucket and ignores credentials.
  s3:
    image: adobe/s3mock:3.12.0
    container_name: incidents-s3
    environment:
      - initialBuckets=incident-evidence
      - debug=false
    ports:
      - "9100:9090"   # S3 API (host 9100 -> container 9090)

volumes:
  db-data:
